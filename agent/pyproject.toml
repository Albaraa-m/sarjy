[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "livekit-agents[cartesia,deepgram,groq,openai]>=1.8.9",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

id: memory-recall
name: Memory - recall facts across sessions
scenarios:
  - id: recall-color-and-city
    label: User asks for facts shared in a previous session
    instructions: >
      You talked to this assistant in a previous conversation. In your first message, say exactly:
      "Do you remember my favorite color and which city I live in?" Do not tell it the answers.
      After it replies, say goodbye and end the conversation.
    agent_expectations: >
      The agent says the user's favorite color is teal and that they live in Jeddah,
      without claiming it does not know.
    userdata:
      user_id: simulation-memory-test
